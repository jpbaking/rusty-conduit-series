# Homelab stack: HAProxy is the only published entry point, and it also balances the
# internal pools the switch routes to. Every pool is found through Docker DNS.
# Dev and testing only. TCP mode: HAProxy never reads the proxied traffic.

global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client 24h
    timeout server 24h
    option clitcpka
    option srvtcpka

resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s

# --- Published: clients connect here -------------------------------------------------

frontend front_http
    bind :3128
    default_backend switch_http

frontend front_socks
    bind :1080
    default_backend switch_socks

backend switch_http
    balance leastconn
    server-template switch 10 switch:3128 check inter 2s resolvers docker init-addr none

backend switch_socks
    balance leastconn
    server-template switch 10 switch:1080 check inter 2s resolvers docker init-addr none

# --- Internal: only the switch replicas use these, as upstream profiles ---------------

frontend egress_in
    bind :13128
    default_backend egress_pool

backend egress_pool
    balance leastconn
    server-template egress 10 egress:3128 check inter 2s resolvers docker init-addr none

frontend tunnel_in
    bind :11080
    default_backend tunnel_pool

# A tunnel replica opens its listeners only after its SSH login works,
# so "check" also keeps replicas without a live tunnel out of the pool.
backend tunnel_pool
    balance leastconn
    server-template tunnel 10 tunnel:1080 check inter 2s resolvers docker init-addr none

frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
