# HAProxy in front of a pool of rusty-conduit replicas, found through Docker's DNS.
# Dev and testing only. TCP mode: HAProxy never reads the proxied traffic.

global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    # Proxy tunnels can sit idle for a long time (agents, long polls, SSH).
    # These are inactivity timeouts; raise them if your clients idle longer.
    timeout client 24h
    timeout server 24h
    option clitcpka
    option srvtcpka

# Docker's embedded DNS answers with one A record per running replica.
resolvers docker
    nameserver dns 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s

frontend http_in
    bind :3128
    default_backend pool_http

frontend socks_in
    bind :1080
    default_backend pool_socks

# server-template reserves slots (here 10); each replica fills one as DNS reports it.
# "check" opens a TCP connection, which succeeds once a replica's listener is up.
backend pool_http
    balance leastconn
    server-template proxy 10 proxy:3128 check inter 2s resolvers docker init-addr none

backend pool_socks
    balance leastconn
    server-template proxy 10 proxy:1080 check inter 2s resolvers docker init-addr none

# Stats page: which replicas are up and how many connections each holds.
frontend stats
    mode http
    bind :8404
    stats enable
    stats uri /
    stats refresh 5s
