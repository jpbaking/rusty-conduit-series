<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
<title id="title">rusty-conduit-switch: routing by rules</title>
<desc id="desc">Apps connect to rusty-conduit-switch on port 3128 or 1080. It reads config.toml and reloads it live. Rules run top to bottom and the first match wins: *.office.example goes to the office HTTP proxy; 192.168.1.0/24 and *.home.internal go to a homelab SOCKS5 upstream such as rusty-conduit-ssh; *.doubleclick.net is blocked; everything else goes direct.</desc>
<style>
svg{--text:#e5e9f0;--muted:#9aa5b8;--node:#172033;--line:#3a4864;--zone:#64748b;--acc:#3b82f6;--acc2:#60a5fa;--ssh:#2dd4bf;--bad:#f87171;--ok:#4ade80;--hap:#a78bfa;--onacc:#fff}
@media (prefers-color-scheme:light){svg{--text:#111827;--muted:#4b5568;--node:#f3f6fb;--line:#b8c3d4;--zone:#94a3b8;--acc:#2563eb;--acc2:#2563eb;--ssh:#0d9488;--bad:#dc2626;--ok:#16a34a;--hap:#7c3aed}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--text)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t{font-size:15px;font-weight:600}
.s{font-size:12.5px;fill:var(--muted)}
.c{font-size:13px;fill:var(--muted)}
.zl{font-size:11.5px;font-weight:700;letter-spacing:.08em;fill:var(--zone)}
.bad-t{fill:var(--bad)}.ok-t{fill:var(--ok)}
.pt{fill:var(--onacc);font-size:15px;font-weight:700}
.ps{fill:var(--onacc);opacity:.88;font-size:12.5px}
.node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
.prod{fill:var(--acc)}
.hap{fill:var(--node);stroke:var(--hap);stroke-width:2}
.bad{fill:var(--node);stroke:var(--bad);stroke-width:1.8}
.ok{fill:var(--node);stroke:var(--ok);stroke-width:1.8}
.ghost{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}
.zone{fill:none;stroke:var(--zone);stroke-width:1.5;stroke-dasharray:6 6}
.globe{fill:var(--node);stroke:var(--acc2);stroke-width:1.8}
.f{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:8 7;animation:flow 1.1s linear infinite}
.f-acc{stroke:var(--acc2)}.f-ssh{stroke:var(--ssh)}.f-bad{stroke:var(--bad)}.f-ok{stroke:var(--ok)}.f-hap{stroke:var(--hap)}
.f-mute{stroke:var(--zone);animation:none;stroke-dasharray:4 5}
.pipe{fill:none;stroke:var(--ssh);stroke-opacity:.2;stroke-width:24;stroke-linecap:round}
.m-acc{fill:var(--acc2)}.m-ssh{fill:var(--ssh)}.m-bad{fill:var(--bad)}.m-ok{fill:var(--ok)}.m-hap{fill:var(--hap)}.m-mute{fill:var(--zone)}
@keyframes flow{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<defs><marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-acc"/></marker><marker id="m-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-ssh"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-bad"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-ok"/></marker><marker id="m-hap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-hap"/></marker><marker id="m-mute" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-mute"/></marker></defs>
<rect x="20" y="170" width="130" height="60" rx="10" class="node"/>
<text x="85.0" y="204.5" class="t" text-anchor="middle">Your apps</text>
<path d="M150,200H197" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="200" y="150" width="200" height="100" rx="10" class="prod"/>
<text x="300.0" y="196.0" class="pt mono" text-anchor="middle">rusty-conduit-switch</text>
<text x="300.0" y="214.0" class="ps mono" text-anchor="middle">:3128 · :1080</text>
<rect x="200" y="30" width="200" height="56" rx="10" class="node"/>
<text x="300.0" y="54.0" class="t mono" text-anchor="middle">config.toml</text>
<text x="300.0" y="72.0" class="s" text-anchor="middle">--watch-config: live reload</text>
<path d="M300,86V147" class="f f-mute" marker-end="url(#m-mute)"/>
<text x="565" y="40" class="zl" text-anchor="middle">RULES · FIRST MATCH WINS</text>
<path d="M400,200H425" class="f f-acc"/>
<path d="M425,82V298" class="f f-acc"/>
<path d="M425,82H447" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="450" y="60" width="230" height="44" rx="10" class="node"/>
<text x="466" y="86" class="s" text-anchor="start">1</text>
<text x="490" y="86" class="c mono" text-anchor="start">*.office.example</text>
<path d="M680,82H737" class="f f-acc" marker-end="url(#m-acc)"/>
<path d="M425,136H447" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="450" y="114" width="230" height="44" rx="10" class="node"/>
<text x="466" y="140" class="s" text-anchor="start">2</text>
<text x="490" y="140" class="c mono" text-anchor="start">192.168.1.0/24</text>
<path d="M680,136H737" class="f f-acc" marker-end="url(#m-acc)"/>
<path d="M425,190H447" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="450" y="168" width="230" height="44" rx="10" class="node"/>
<text x="466" y="194" class="s" text-anchor="start">3</text>
<text x="490" y="194" class="c mono" text-anchor="start">*.home.internal</text>
<path d="M680,190H737" class="f f-acc" marker-end="url(#m-acc)"/>
<path d="M425,244H447" class="f f-bad" marker-end="url(#m-bad)"/>
<rect x="450" y="222" width="230" height="44" rx="10" class="node"/>
<text x="466" y="248" class="s" text-anchor="start">4</text>
<text x="490" y="248" class="c mono" text-anchor="start">*.doubleclick.net</text>
<path d="M680,244H737" class="f f-bad" marker-end="url(#m-bad)"/>
<path d="M425,298H447" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="450" y="276" width="230" height="44" rx="10" class="node"/>
<text x="466" y="302" class="s" text-anchor="start">5</text>
<text x="490" y="302" class="c mono" text-anchor="start">default</text>
<path d="M680,298H737" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="740" y="60" width="200" height="44" rx="10" class="node"/>
<text x="840.0" y="78.0" class="t" text-anchor="middle">office proxy</text>
<text x="840.0" y="96.0" class="s" text-anchor="middle">http upstream</text>
<rect x="740" y="114" width="200" height="98" rx="10" class="node"/>
<text x="840.0" y="150.5" class="t" text-anchor="middle">homelab</text>
<text x="840.0" y="168.5" class="s" text-anchor="middle">socks5 upstream</text>
<text x="840.0" y="186.5" class="s" text-anchor="middle">e.g. rusty-conduit-ssh</text>
<rect x="740" y="222" width="200" height="44" rx="10" class="bad"/>
<text x="840.0" y="240.0" class="t" text-anchor="middle">block</text>
<text x="840.0" y="258.0" class="s" text-anchor="middle">refused</text>
<rect x="740" y="276" width="200" height="44" rx="10" class="node"/>
<text x="840.0" y="294.0" class="t" text-anchor="middle">direct</text>
<text x="840.0" y="312.0" class="s" text-anchor="middle">straight out</text>
<text x="480" y="356" class="s" text-anchor="middle">Any target can be a failover chain, like [&quot;vpn&quot;, &quot;ssh&quot;, &quot;direct&quot;].</text>
<text x="480" y="378" class="s" text-anchor="middle">test-route shows which rule and upstream a host would use.</text>
</svg>
