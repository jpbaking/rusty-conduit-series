<rect x="165" y="130" width="130" height="96" rx="10" class="hap"/>
<text x="230.0" y="174.0" class="t" text-anchor="middle">HAProxy</text>
<text x="230.0" y="192.0" class="s mono" text-anchor="middle">:3128 · :1080</text>
<rect x="165" y="245" width="130" height="36" rx="10" class="node"/>
<text x="230.0" y="267.5" class="c mono" text-anchor="middle">:8404 stats</text>
<path d="M295,178H332" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="345" y="128" width="140" height="80" rx="10" class="prod" opacity=".45"/>
<rect x="340" y="133" width="140" height="80" rx="10" class="prod" opacity=".7"/>
<rect x="335" y="138" width="140" height="80" rx="10" class="prod"/>
<text x="405.0" y="174.0" class="pt" text-anchor="middle">switch ×N</text>
<text x="405.0" y="192.0" class="ps" text-anchor="middle">rules · reload</text>
<text x="595" y="28" class="zl" text-anchor="middle">RULES</text>
<text x="760" y="190" class="zl" text-anchor="middle">HAPROXY FRONTENDS</text>
<path d="M485,178C505,178 505,60 527,60" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="530" y="40" width="130" height="40" rx="10" class="node"/>
<text x="595.0" y="64.5" class="c mono" text-anchor="middle">direct</text>
<path d="M485,178C505,178 505,130 527,130" class="f f-bad" marker-end="url(#m-bad)"/>
<rect x="530" y="110" width="130" height="40" rx="10" class="bad"/>
<text x="595.0" y="134.5" class="c mono" text-anchor="middle">block</text>
<path d="M485,178C505,178 505,220 527,220" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="530" y="200" width="130" height="40" rx="10" class="node"/>
<text x="595.0" y="224.5" class="c mono" text-anchor="middle">egress</text>
<path d="M485,178C505,178 505,300 527,300" class="f f-ssh" marker-end="url(#m-ssh)"/>
<rect x="530" y="280" width="130" height="40" rx="10" class="node"/>
<text x="595.0" y="304.5" class="c mono" text-anchor="middle">tunnel</text>
<path d="M660,60H719" class="f f-acc" marker-end="url(#m-acc)"/>
<g><circle cx="745" cy="60" r="22" class="globe"/><ellipse cx="745" cy="60" rx="9.9" ry="22" class="globe" fill="none"/><path d="M723,60H767" class="globe"/></g>
<text x="775" y="65" class="c" text-anchor="start">internet</text>
<path d="M595,240V277" class="f f-mute" marker-end="url(#m-mute)"/>
<text x="605" y="263" class="s" text-anchor="start">failover</text>
<path d="M660,220H697" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="700" y="200" width="120" height="40" rx="10" class="hap"/>
<text x="760.0" y="224.5" class="t mono" text-anchor="middle">:13128</text>
