<rect x="700" y="280" width="120" height="40" rx="10" class="hap"/>
<text x="760.0" y="304.5" class="t mono" text-anchor="middle">:11080</text>
<path d="M820,220H857" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="870" y="186" width="110" height="48" rx="10" class="node" opacity=".45"/>
<rect x="865" y="191" width="110" height="48" rx="10" class="node" opacity=".7"/>
<rect x="860" y="196" width="110" height="48" rx="10" class="node"/>
<text x="915.0" y="224.5" class="t" text-anchor="middle">egress ×N</text>
<path d="M820,300H857" class="f f-ssh" marker-end="url(#m-ssh)"/>
<rect x="870" y="266" width="110" height="48" rx="10" class="node" opacity=".45"/>
<rect x="865" y="271" width="110" height="48" rx="10" class="node" opacity=".7"/>
<rect x="860" y="276" width="110" height="48" rx="10" class="node"/>
<text x="915.0" y="304.5" class="t" text-anchor="middle">tunnel ×N</text>
<path d="M970,220H1026" class="f f-acc" marker-end="url(#m-acc)"/>
<g><circle cx="1052" cy="220" r="22" class="globe"/><ellipse cx="1052" cy="220" rx="9.9" ry="22" class="globe" fill="none"/><path d="M1030,220H1074" class="globe"/></g>
<text x="1052" y="260" class="s" text-anchor="middle">internet</text>
