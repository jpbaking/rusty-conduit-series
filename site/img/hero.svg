<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="title desc">
<title id="title">How traffic flows through rusty-conduit</title>
<desc id="desc">Browsers, CLIs, SDKs, agents and containers connect over HTTP, HTTPS or SOCKS to one of three proxies. rusty-conduit sends traffic straight to the internet. rusty-conduit-ssh sends it through an ssh -D tunnel to a bastion and on into a private network, where names resolve. rusty-conduit-switch picks direct, an upstream proxy, or block for each connection, by the first matching rule.</desc>
<style>
svg{--text:#e5e9f0;--muted:#9aa5b8;--node:#172033;--line:#3a4864;--zone:#64748b;--acc:#3b82f6;--acc2:#60a5fa;--ssh:#2dd4bf;--bad:#f87171;--ok:#4ade80;--hap:#a78bfa;--onacc:#fff}
@media (prefers-color-scheme:light){svg{--text:#111827;--muted:#4b5568;--node:#f3f6fb;--line:#b8c3d4;--zone:#94a3b8;--acc:#2563eb;--acc2:#2563eb;--ssh:#0d9488;--bad:#dc2626;--ok:#16a34a;--hap:#7c3aed}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--text)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t{font-size:15px;font-weight:600}
.s{font-size:12.5px;fill:var(--muted)}
.c{font-size:13px;fill:var(--muted)}
.zl{font-size:11.5px;font-weight:700;letter-spacing:.08em;fill:var(--zone)}
.bad-t{fill:var(--bad)}.ok-t{fill:var(--ok)}
.pt{fill:var(--onacc);font-size:15px;font-weight:700}
.ps{fill:var(--onacc);opacity:.88;font-size:12.5px}
.node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
.prod{fill:var(--acc)}
.hap{fill:var(--node);stroke:var(--hap);stroke-width:2}
.bad{fill:var(--node);stroke:var(--bad);stroke-width:1.8}
.ok{fill:var(--node);stroke:var(--ok);stroke-width:1.8}
.ghost{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}
.zone{fill:none;stroke:var(--zone);stroke-width:1.5;stroke-dasharray:6 6}
.globe{fill:var(--node);stroke:var(--acc2);stroke-width:1.8}
.f{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:8 7;animation:flow 1.1s linear infinite}
.f-acc{stroke:var(--acc2)}.f-ssh{stroke:var(--ssh)}.f-bad{stroke:var(--bad)}.f-ok{stroke:var(--ok)}.f-hap{stroke:var(--hap)}
.f-mute{stroke:var(--zone);animation:none;stroke-dasharray:4 5}
.pipe{fill:none;stroke:var(--ssh);stroke-opacity:.2;stroke-width:24;stroke-linecap:round}
.m-acc{fill:var(--acc2)}.m-ssh{fill:var(--ssh)}.m-bad{fill:var(--bad)}.m-ok{fill:var(--ok)}.m-hap{fill:var(--hap)}.m-mute{fill:var(--zone)}
@keyframes flow{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<defs><marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-acc"/></marker><marker id="m-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-ssh"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-bad"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-ok"/></marker><marker id="m-hap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-hap"/></marker><marker id="m-mute" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-mute"/></marker></defs>
<text x="20" y="62" class="zl" text-anchor="start">YOUR APPS</text>
<text x="455" y="62" class="zl" text-anchor="middle">ONE ENGINE · HTTP · HTTPS · SOCKS IN</text>
<text x="700" y="62" class="zl" text-anchor="start">WHERE IT GOES</text>
<rect x="20" y="90" width="170" height="46" rx="10" class="node"/>
<text x="105.0" y="117.5" class="t" text-anchor="middle">Browser</text>
<path d="M190,113H250" class="f f-acc"/>
<rect x="20" y="165" width="170" height="46" rx="10" class="node"/>
<text x="105.0" y="192.5" class="t" text-anchor="middle">curl &amp; CLIs</text>
<path d="M190,188H250" class="f f-acc"/>
<rect x="20" y="240" width="170" height="46" rx="10" class="node"/>
<text x="105.0" y="267.5" class="t" text-anchor="middle">SDKs &amp; agents</text>
<path d="M190,263H250" class="f f-acc"/>
<rect x="20" y="315" width="170" height="46" rx="10" class="node"/>
<text x="105.0" y="342.5" class="t" text-anchor="middle">Containers</text>
<path d="M190,338H250" class="f f-acc"/>
<path d="M250,110V338" class="f f-acc"/>
<path d="M250,110H327" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="330" y="80" width="250" height="60" rx="10" class="prod"/>
<text x="455.0" y="106.0" class="pt mono" text-anchor="middle">rusty-conduit</text>
<text x="455.0" y="124.0" class="ps" text-anchor="middle">direct</text>
<path d="M250,215H327" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="330" y="185" width="250" height="60" rx="10" class="prod"/>
<text x="455.0" y="211.0" class="pt mono" text-anchor="middle">rusty-conduit-ssh</text>
<text x="455.0" y="229.0" class="ps" text-anchor="middle">through SSH</text>
<path d="M250,320H327" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="330" y="290" width="250" height="60" rx="10" class="prod"/>
<text x="455.0" y="316.0" class="pt mono" text-anchor="middle">rusty-conduit-switch</text>
<text x="455.0" y="334.0" class="ps" text-anchor="middle">by rules</text>
<path d="M580,110H704" class="f f-acc" marker-end="url(#m-acc)"/>
<g><circle cx="730" cy="110" r="22" class="globe"/><ellipse cx="730" cy="110" rx="9.9" ry="22" class="globe" fill="none"/><path d="M708,110H752" class="globe"/></g>
<text x="762" y="115" class="t" text-anchor="start">Internet</text>
<path d="M592,215H690" class="pipe"/>
<path d="M582,215H696" class="f f-ssh" marker-end="url(#m-ssh)"/>
<text x="640" y="199" class="c mono" text-anchor="middle">ssh -D</text>
<rect x="700" y="192" width="100" height="46" rx="10" class="node"/>
<text x="750.0" y="219.5" class="t" text-anchor="middle">bastion</text>
<path d="M800,215H826" class="f f-ssh" marker-end="url(#m-ssh)"/>
<rect x="830" y="192" width="118" height="46" rx="10" class="node"/>
<text x="889.0" y="219.5" class="t" text-anchor="middle">private net</text>
<text x="889" y="256" class="s" text-anchor="middle">names resolve there</text>
<path d="M580,320C650,320 650,282 716,282" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="720" y="268" width="104" height="28" rx="14" class="node"/>
<text x="772.0" y="286.5" class="c mono" text-anchor="middle">direct</text>
<text x="838" y="286" class="s" text-anchor="start">→ internet</text>
<path d="M580,320C650,320 650,318 716,318" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="720" y="304" width="104" height="28" rx="14" class="node"/>
<text x="772.0" y="322.5" class="c mono" text-anchor="middle">proxy A</text>
<text x="838" y="322" class="s" text-anchor="start">→ office proxy</text>
<path d="M580,320C650,320 650,354 716,354" class="f f-acc" marker-end="url(#m-acc)"/>
<rect x="720" y="340" width="104" height="28" rx="14" class="node"/>
<text x="772.0" y="358.5" class="c mono" text-anchor="middle">proxy B</text>
<text x="838" y="358" class="s" text-anchor="start">→ VPN or SSH</text>
<path d="M580,320C650,320 650,390 716,390" class="f f-bad" marker-end="url(#m-bad)"/>
<rect x="720" y="376" width="104" height="28" rx="14" class="bad"/>
<text x="772.0" y="394.5" class="c mono" text-anchor="middle">block</text>
<text x="838" y="394" class="s bad-t" text-anchor="start">refused</text>
<text x="455" y="372" class="s" text-anchor="middle">first matching rule wins · hot reload</text>
</svg>
