<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="title desc">
<title id="title">Failover chain</title>
<desc id="desc">A switch rule targets the chain vpn, ssh, direct. The vpn connect fails, so the ssh profile is tried and serves the connection; direct is not tried. The next profile is used only when the connect or handshake fails.</desc>
<style>
svg{--text:#e5e9f0;--muted:#9aa5b8;--node:#172033;--line:#3a4864;--zone:#64748b;--acc:#3b82f6;--acc2:#60a5fa;--ssh:#2dd4bf;--bad:#f87171;--ok:#4ade80;--hap:#a78bfa;--onacc:#fff}
@media (prefers-color-scheme:light){svg{--text:#111827;--muted:#4b5568;--node:#f3f6fb;--line:#b8c3d4;--zone:#94a3b8;--acc:#2563eb;--acc2:#2563eb;--ssh:#0d9488;--bad:#dc2626;--ok:#16a34a;--hap:#7c3aed}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:var(--text)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t{font-size:15px;font-weight:600}
.s{font-size:12.5px;fill:var(--muted)}
.c{font-size:13px;fill:var(--muted)}
.zl{font-size:11.5px;font-weight:700;letter-spacing:.08em;fill:var(--zone)}
.bad-t{fill:var(--bad)}.ok-t{fill:var(--ok)}
.pt{fill:var(--onacc);font-size:15px;font-weight:700}
.ps{fill:var(--onacc);opacity:.88;font-size:12.5px}
.node{fill:var(--node);stroke:var(--line);stroke-width:1.5}
.prod{fill:var(--acc)}
.hap{fill:var(--node);stroke:var(--hap);stroke-width:2}
.bad{fill:var(--node);stroke:var(--bad);stroke-width:1.8}
.ok{fill:var(--node);stroke:var(--ok);stroke-width:1.8}
.ghost{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:5 5}
.zone{fill:none;stroke:var(--zone);stroke-width:1.5;stroke-dasharray:6 6}
.globe{fill:var(--node);stroke:var(--acc2);stroke-width:1.8}
.f{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:8 7;animation:flow 1.1s linear infinite}
.f-acc{stroke:var(--acc2)}.f-ssh{stroke:var(--ssh)}.f-bad{stroke:var(--bad)}.f-ok{stroke:var(--ok)}.f-hap{stroke:var(--hap)}
.f-mute{stroke:var(--zone);animation:none;stroke-dasharray:4 5}
.pipe{fill:none;stroke:var(--ssh);stroke-opacity:.2;stroke-width:24;stroke-linecap:round}
.m-acc{fill:var(--acc2)}.m-ssh{fill:var(--ssh)}.m-bad{fill:var(--bad)}.m-ok{fill:var(--ok)}.m-hap{fill:var(--hap)}.m-mute{fill:var(--zone)}
@keyframes flow{to{stroke-dashoffset:-30}}
@media (prefers-reduced-motion:reduce){.f{animation:none}}
</style>
<defs><marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-acc"/></marker><marker id="m-ssh" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-ssh"/></marker><marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-bad"/></marker><marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-ok"/></marker><marker id="m-hap" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-hap"/></marker><marker id="m-mute" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" class="m-mute"/></marker></defs>
<rect x="20" y="105" width="150" height="70" rx="10" class="prod"/>
<text x="95.0" y="136.0" class="pt mono" text-anchor="middle">switch</text>
<text x="95.0" y="154.0" class="ps" text-anchor="middle">rule target</text>
<text x="405" y="28" class="c mono" text-anchor="middle">target = [&quot;vpn&quot;, &quot;ssh&quot;, &quot;direct&quot;]</text>
<path d="M170,125C250,125 250,75 327,75" class="f f-bad" marker-end="url(#m-bad)"/>
<path d="M170,140C250,140 250,150 327,150" class="f f-ok" marker-end="url(#m-ok)"/>
<path d="M170,155C250,155 250,225 327,225" class="f f-mute" marker-end="url(#m-mute)"/>
<rect x="330" y="50" width="150" height="50" rx="10" class="bad"/>
<text x="405.0" y="71.0" class="t" text-anchor="middle">1  vpn</text>
<text x="405.0" y="89.0" class="s" text-anchor="middle">✕ connect failed</text>
<rect x="330" y="125" width="150" height="50" rx="10" class="ok"/>
<text x="405.0" y="146.0" class="t" text-anchor="middle">2  ssh</text>
<text x="405.0" y="164.0" class="s" text-anchor="middle">✓ serves it</text>
<rect x="330" y="200" width="150" height="50" rx="10" class="ghost"/>
<text x="405.0" y="221.0" class="t" text-anchor="middle">3  direct</text>
<text x="405.0" y="239.0" class="s" text-anchor="middle">not tried</text>
<path d="M480,150H549" class="f f-ok" marker-end="url(#m-ok)"/>
<g><circle cx="577" cy="150" r="22" class="globe"/><ellipse cx="577" cy="150" rx="9.9" ry="22" class="globe" fill="none"/><path d="M555,150H599" class="globe"/></g>
<text x="577" y="192" class="s" text-anchor="middle">Internet</text>
<text x="320" y="285" class="s" text-anchor="middle">Next profile only if the connect or handshake fails, never after bytes flow</text>
</svg>
